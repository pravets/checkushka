name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  jars:
    name: Сборка и jar-артефакты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Проверить соответствие тега и версии
        run: |
          VERSION=$(./gradlew -q properties --console=plain | awk '/^version:/ {print $2}')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Версия проекта ($VERSION) не совпадает с тегом ($TAG)"
            exit 1
          fi

      - name: Сборка и тесты
        run: ./gradlew build --no-daemon

      - name: Черновик релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "$GITHUB_REF_NAME"
          fi

      - name: Прикрепить jar-артефакты
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            cli/build/libs/checkushka-*-exec.jar \
            core/build/libs/checkushka-core-*.jar \
            --clobber

      - name: Передать exec-jar в упаковку
        uses: actions/upload-artifact@v4
        with:
          name: exec-jar
          path: cli/build/libs/checkushka-*-exec.jar
          if-no-files-found: error

  images:
    name: Образ (${{ matrix.prefix }})
    needs: jars
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            prefix: win
            python: python
          - os: ubuntu-latest
            prefix: nix
            python: python3
          - os: macos-latest
            prefix: mac
            python: python3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Получить exec-jar
        uses: actions/download-artifact@v4
        with:
          name: exec-jar
          path: dist

      - name: Собрать образ со встроенным JRE
        run: ${{ matrix.python }} .github/scripts/package-image.py --jar dist --prefix ${{ matrix.prefix }} --out .

      - name: Прикрепить архив к релизу
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "checkushka_${{ matrix.prefix }}.zip" --repo "${{ github.repository }}" --clobber

  publish:
    name: Опубликовать релиз
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Снять черновик
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false

[versions]
java-release = "21"
mdclasses = "0.21.0"
bsl-common-library = "0.12.5"
jackson = "2.22.4"
picocli = "4.7.7"
slf4j = "2.0.20"
junit = "6.1.3"
assertj = "3.27.7"
mcp = "2.1.0"
jetty = "12.1.14"
servlet-api = "6.1.0"
[libraries]
mdclasses = { module = "io.github.1c-syntax:mdclasses", version.ref = "mdclasses" }
bsl-common-library = { module = "io.github.1c-syntax:bsl-common-library", version.ref = "bsl-common-library" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
mcp-sdk = { module = "io.modelcontextprotocol.sdk:mcp", version.ref = "mcp" }
mcp-core = { module = "io.modelcontextprotocol.sdk:mcp-core", version.ref = "mcp" }
mcp-json-jackson2 = { module = "io.modelcontextprotocol.sdk:mcp-json-jackson2", version.ref = "mcp" }
jetty-ee11-servlet = { module = "org.eclipse.jetty.ee11:jetty-ee11-servlet", version.ref = "jetty" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api", version.ref = "servlet-api" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
license = { id = "cloud.rio.license", version = "0.18.0" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
